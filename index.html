:root{
  --bg:#f1f5f4; --surface:#ffffff; --ink:#132528; --muted:#587074; --line:#d6e0df;
  --accent:#0c7566; --accent-ink:#ffffff; --tint:#dcf0ec;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:21px;letter-spacing:-.01em}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.stepper button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;font-size:19px;line-height:1}
.stepper button:active{background:var(--tint)}
.stepper span{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:500;font-size:14px}
.prog{display:flex;align-items:center;gap:12px;margin-top:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.prog span{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}

/* Navigation basse */
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav button{border:0;background:transparent;border-radius:12px;padding:10px 4px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
nav button[aria-current="page"]{background:var(--tint);color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600}

/* ---------- Outils ---------- */
function norm(s){return String(s==null?'':s).toLowerCase().replace(/œ/g,'oe').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fr(n,d){return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d==null?2:d})}
function money(n){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function cap(s){s=String(s).trim();return s.charAt(0).toUpperCase()+s.slice(1)}
function slug(s){return 'm_'+norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function $(id){return document.getElementById(id)}

function canonName(raw){
  raw=String(raw).replace(/\(.*?\)/g,'').trim();
  var n=norm(raw);
  return ALIAS[n]||cap(raw);
}
function normUnit(u){
  var n=norm(u);
  if(!n) return '';
  if(/^(g|gr|gramme|grammes)$/.test(n)) return 'g';
  if(n==='kg') return 'kg';
  if(n==='ml'||n==='millilitres'||n==='millilitre') return 'ml';
  if(n==='cl') return 'cl';
  if(n==='l'||n==='litre'||n==='litres') return 'l';
  if(/^pieces?$|^lot$|^unites?$|^unite$/.test(n)) return 'pièce';
  if(/^paquets?$/.test(n)) return 'paquet';
  if(n==='pot'||n==='pots') return 'pot';
  if(/^boites?/.test(n)) return 'boîte';
  if(/^bocal|^bocaux/.test(n)) return 'pot';
  if(/^buche|^morceau/.test(n)) return 'pièce';
  if(/^barquette/.test(n)) return 'paquet';
  if(/^tranches?$/.test(n)) return 'tranches';
  if(/^portions?$/.test(n)) return 'portion';
  if(/^sachets?$/.test(n)) return 'paquet';
  return '';
}
function matchRayon(s){
  var n=norm(s);
  if(/surgel/.test(n)) return 'Surgelés';
  if(/creme|laitier/.test(n)) return 'Crèmerie';
  if(/oeuf/.test(n)) return 'Œufs';
  if(/fruit|legume/.test(n)) return 'Fruits et légumes';
  if(/pain|boulang/.test(n)) return 'Pain et boulangerie';
  if(/boucher|viande/.test(n)) return 'Boucherie';
  if(/poisson/.test(n)) return 'Poissonnerie';
  if(/charcut|traiteur/.test(n)) return 'Charcuterie traiteur';
  if(/conserv/.test(n)) return 'Conserves';
  if(/sucr/.test(n)) return 'Épicerie sucrée';
  if(/epicerie|sale/.test(n)) return 'Épicerie salée';
  if(/boisson/.test(n)) return 'Boissons';
  if(/hygi|entretien/.test(n)) return 'Hygiène et entretien';
  return 'Autre';
}
function matchCat(s){
  var n=norm(s);
  for(var i=0;i<CATS.length;i++){ if(norm(CATS[i])===n) return CATS[i]; }
  if(/rapide|sandwich|burger|taco|wrap|kebab/.test(n)) return CATS[3];
  if(/pizza|tarte|brick/.test(n)) return CATS[4];
  if(/soupe|salade|entree/.test(n)) return CATS[5];
  if(/pate|nouille/.test(n)) return CATS[0];
  if(/viande|volaille|poulet|boeuf|canard|porc/.test(n)) return CATS[1];
  return CATS[2];
}

var RAYG=[[/^pates? (brisee|feuilletee|a pizza)|feuilles de brick/,'Crèmerie'],[/poulet|steak|boeuf|porc|veau|agneau|canard|saucisse|merguez|viande|gigot|magret/,'Boucherie'],

 [/oeuf/,'Œufs'],[/saumon|crevette|fruits de mer|poisson/,'Poissonnerie'],[/^pain|wraps|brioche/,'Pain et boulangerie'],
 [/miel|sucre|levure|maizena/,'Épicerie sucrée'],[/thon|mais|sauce tomate|flageolets|pois chiches|lait de coco/,'Conserves'],
 [/^pates?( |$)|nouilles|riz|semoule|farine|sauce|moutarde|mayonnaise|algues|curry|cornichons|chapelure/,'Épicerie salée'],
 [/pomme|carotte|courgette|concombre|tomate|oignon|ail$|echalote|poivron|salade|chou|celeri|brocoli|epinard|champignon|avocat|aubergine|butternut|potimarron|poireau|citron|fruit|legume/,'Fruits et légumes']];
function rayonFor(nn){
  var kn=knownIngs()[nn]; if(kn) return kn.r;
  for(var i=0;i<RAYG.length;i++){ if(RAYG[i][0].test(nn)) return RAYG[i][1]; }
  return 'Autre';
}
function parseIng(line){
  var p=line.split('|').map(function(x){return x.trim()});
  if(p.length<5&&/^(frais|surgel|sec|conserve|\?)/.test(norm(p[3]||''))) p=[p[0],p[1],p[2],'',p[3]];
  var name=canonName(p[0]); var nn=norm(name);
  if(!nn||/(^|\b)pst(\b|$)|proteines? de soja/.test(nn)) return null;
  var std=STD[nn]; var q=NaN, est=false;
  var ud=(typeof state!=='undefined'&&state.defs)?state.defs[nn]:null;
  if(ud) std=[ud.q,ud.u,(std&&std[1]===ud.u)?std[2]:0];
  var m=(p[1]||'').match(/^(\d+(?:[.,]\d+)?)\s*(~)?/);
  if(m){q=parseFloat(m[1].replace(',','.')); est=!!m[2];}
  var u=normUnit(p[2]||'');
  if(isNaN(q)){
    if(std){q=std[0]; u=std[1];} else {q=1; u='pièce';}
    est=!ud;
  } else {
    if(u==='kg'){q*=1000;u='g';} else if(u==='l'){q*=1000;u='ml';} else if(u==='cl'){q*=10;u='ml';}
    if(!u) u=std?std[1]:'pièce';
  }
  var pk=(std&&std[2]&&std[1]===u)?std[2]:0;
  var st=norm(p[4]||'');
  var r=p[3]?matchRayon(p[3]):rayonFor(nn);
  var s;
  if(/surgel/.test(st)) s='surgelé';
  else if(/conserve/.test(st)) s='conserve';
  else if(/^sec/.test(st)) s='sec';
  else if(/frais/.test(st)) s='frais';
  else if(r==='Surgelés') s='surgelé';
  else if(r==='Conserves') s='conserve';
  else if(r==='Épicerie salée'||r==='Épicerie sucrée'||r==='Boissons') s='sec';
  else s='frais';
  if(r==='Surgelés') r=FRESHR[nn]||'Autre';
  if(!p[3]&&s==='conserve') r='Conserves';
  return {n:name,q:Math.round(q*100)/100,u:u,r:r,s:s,e:est,pk:pk};
}
function parseMeals(text){
  var meals=[],cur=null;
  String(text).split(/\r?\n/).forEach(function(raw){
    var l=raw.replace(/\*\*/g,'').replace(/\\/g,'').replace(/&#x20;/g,' ').trim();
    if(!l) return;
    var m;
    if((m=l.match(/^#*\s*REPAS\s*:\s*(.+)$/i))){cur={id:slug(m[1]),name:m[1].trim(),cat:CATS[2],base:2,note:'',ings:[]};meals.push(cur);return;}
    if(!cur) return;
    if((m=l.match(/^CAT[ÉE]GORIE\s*:\s*(.+)$/i))){cur.cat=matchCat(m[1]);cur.catSet=true;return;}
    if((m=l.match(/^PERSONNES\s*:\s*(\d+)/i))){cur.base=Math.max(1,parseInt(m[1],10));return;}
    if((m=l.match(/^NOTE\s*:\s*(.+)$/i))){cur.note=m[1].trim();return;}
    if((m=l.match(/^[-*•]\s*(.+\|.+)$/))){var ing=parseIng(m[1]); if(ing) cur.ings.push(ing);}
  });
  return meals.filter(function(x){return x.name&&x.ings.length});
}
function qtyField(i){return (i.e&&0)?'':String(i.q).replace('.',',')+(i.e?'~':'')}
function serialize(m){
  var out=['REPAS : '+m.name,'CATÉGORIE : '+m.cat,'PERSONNES : '+m.base];
  if(m.note) out.push('NOTE : '+m.note);
  out.push('INGRÉDIENTS :');
  m.ings.forEach(function(i){out.push('- '+[i.n,qtyField(i),i.u,i.r,i.s].join(' | '))});
  return out.join('\n');
}

    var inRm={};rm.forEach(function(m){inRm[m.id]=1});
    keepLocal.forEach(function(m){if(!inRm[m.id]&&state.deleted.indexOf(m.id)<0) rm.push(m)});
    var ids={};rm.forEach(function(m){ids[m.id]=m;var i=state.meals.map(function(x){return x.id}).indexOf(m.id);if(i>=0) state.meals[i]=m;else state.meals.push(m)});

function syncPull(){
  if(!sy.code||sy.busy) return Promise.resolve();

    if(r.status===404) return syncPush();
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json().then(function(d){
      var f=d.fields||{},ts=Number((f.ts||{}).integerValue||0);
      if(ts>sy.base&&ts>sy.lm){applyRemote((f.data||{}).stringValue||'{}');sy.base=ts;sy.lm=ts;syncSave();setMsg('Mis à jour depuis l’autre appareil')}

function effState(ing){var o=state.stateOv[norm(ing.n)];return (o&&(ing.s==='frais'||ing.s==='surgelé'))?o:ing.s}
function mealFactor(id){var s=state.sel[id],m=mealById(id);if(!s||!m) return 0;return ((s.p||state.persons)/(m.base||2))*s.n}
function buildList(){
  var lines={};
  Object.keys(state.sel).forEach(function(id){
    var m=mealById(id); if(!m) return; var f=mealFactor(id);
    m.ings.forEach(function(ing,idx){
      var st=effState(ing);
      var key=norm(ing.n)+'|'+st+'|'+ing.u;
      var ln=lines[key]||(lines[key]={key:key,name:ing.n,st:st,u:ing.u,r:ing.r,tot:0,pk:0,est:false,contrib:[],orig:ing.s});
      ln.tot+=ing.q*f; if(ing.e) ln.est=true;
      ln.contrib.push({id:id,idx:idx,q:ing.q*f,f:f,meal:m.name});
      var po=state.packOv[norm(ing.n)+'|'+ing.u];
      ln.pk=(po!=null)?po:(ln.pk||ing.pk||0);
    });
  });
  (state.extras||[]).forEach(function(e){
    var st=effState({n:e.n,s:e.s});
    var key=norm(e.n)+'|'+st+'|'+e.u+'|'+e.id;
    lines[key]={key:key,name:e.n,st:st,u:e.u,r:e.r,tot:e.q,pk:0,est:false,contrib:[],orig:e.s,extra:e.id};
  });
  var arr=Object.keys(lines).map(function(k){var l=lines[k];finish(l);return l});
  arr.sort(function(a,b){
    var ta=tempOf(a),tb=tempOf(b); if(ta!==tb) return ta-tb;
    var ra=ta===2?0:state.order.indexOf(a.r),rb=tb===2?0:state.order.indexOf(b.r);
    if(ra!==rb) return ra-rb;
    return a.name.localeCompare(b.name,'fr');
  });
  return arr;
}
function tempOf(l){return l.st==='surgelé'?2:(l.st==='frais'?1:0)}
var WEIGHED=/^(pates|spaghettis|tagliatelles|macaronis|penne|fusilli|nouilles chinoises|nouilles)$/;
function finish(l){
  var t=l.tot-1e-6;
  var bc=state.bagCfg[norm(l.name)];
  if(l.u==='pièce'&&bc&&bc.min>0&&l.tot>=bc.min-1e-6){l.adj=state.adj[l.key]||0;var nb=Math.max(1,(bc.size>0?Math.ceil(t/bc.size):1)+l.adj);l.text=l.name+' x'+nb+(nb>1?' sachets':' sachet');l.pq=nb;l.pu='le sachet';l.bag=true;}
  else if(l.u==='g'&&WEIGHED.test(norm(l.name))){l.adj=state.adj[l.key]||0;var pk0=l.pk||500;var np=Math.max(1,Math.ceil(t/pk0)+l.adj);var wg=Math.ceil(l.tot/5-1e-9)*5;l.text=l.name+' '+(wg>=1000?fr(wg/1000,2)+' kg':wg+' g')+' (x'+np+')';l.pq=np;l.pu="le paquet";}
  else if(l.pk&&(l.u==='g'||l.u==='ml')){l.adj=state.adj[l.key]||0;l.packs=Math.max(1,Math.ceil(t/l.pk)+l.adj);l.text=l.name+' x'+l.packs;l.pq=l.packs;l.pu="l'unité";}
  else if(COUNT.indexOf(l.u)>=0){l.adj=state.adj[l.key]||0;var c=Math.max(1,Math.ceil(t)+l.adj);l.text=l.name+' x'+c;l.pq=c;l.pu="l'unité";}
  else if(l.u==='tranches'){l.adj=state.adj[l.key]||0;var c2=Math.max(1,Math.ceil(t)+l.adj);l.text=l.name+' '+c2+' tranches';l.pq=c2;l.pu='la tranche';}
  else if(l.u==='g'){l.adj=state.adj[l.key]||0;var g=Math.max(5,Math.ceil(l.tot/5-1e-9)*5+l.adj*100);l.text=l.name+' '+(g>=1000?fr(g/1000,2)+' kg':g+' g');l.pq=g/1000;l.pu='le kg';}
  else if(l.u==='ml'){l.adj=state.adj[l.key]||0;var v=Math.max(5,Math.ceil(l.tot/5-1e-9)*5+l.adj*100);l.text=l.name+' '+(v>=1000?fr(v/1000,2)+' L':v+' ml');l.pq=v/1000;l.pu='le litre';}
  else {l.adj=state.adj[l.key]||0;var c3=Math.max(1,Math.ceil(t)+l.adj);l.text=l.name+' x'+c3;l.pq=c3;l.pu="l'unité";}
  var p=state.prices[l.key];
  l.price=(p!=null&&p!=='')?Number(p):null;
  l.cost=l.price!=null?l.price*l.pq:null;
}
function groups(arr){
  var res=[];
  [0,1,2].forEach(function(t){
    var inT=arr.filter(function(l){return tempOf(l)===t&&!state.stock[l.key]});
    if(!inT.length) return;
    var gs=[],map={};
    inT.forEach(function(l){var r=t===2?'':l.r;if(!map[r]){map[r]={rayon:r,items:[]};gs.push(map[r])}map[r].items.push(l)});
    res.push({temp:t,title:['Température ambiante','Frais','Surgelés'][t],rayons:gs,count:inT.length});
  });
  return res;
}
function listText(arr){

    g.rayons.forEach(function(r){
      out.push((g.temp===2?'Surgelés':r.rayon));

function mealsFiltered(){
  var q=norm(state.q);

    if(state.cat!=='Tous'&&m.cat!==state.cat) return false;
    if(state.flt==='sel'&&!state.sel[m.id]) return false;

function wrapText(ctx,txt,w){
  var words=String(txt).split(' '),lines=[],cur='';
  words.forEach(function(wd){var t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t});
  if(cur) lines.push(cur);return lines;
}
function drawWeek(slots){
  var W=2000,H=1414,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.strokeStyle='#000';x.lineWidth=2;x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';
  var X1=248,X2=1046,HH=92,RH=(H-HH)/7,F='"Open Sans","Helvetica Neue",Arial,sans-serif';
  function ln(a,b,c2,d){x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke()}
  ln(X1,0,X1,H);ln(0,HH,W,HH);ln(X2,HH,X2,H);
  x.font='bold 46px '+F;x.fillText('Midi',(X1+X2)/2+100,HH/2+4);x.fillText('Soir',(X2+W)/2,HH/2+4);
  for(var d=0;d<7;d++){
    var y=HH+d*RH;if(d>0) ln(0,y,W,y);
    x.font='bold 44px '+F;x.fillText(DAYS[d],X1/2,y+RH/2);
    [slots[d*2],slots[d*2+1]].forEach(function(id,k){
      var m=id&&mealById(id);if(!m) return;
      x.font='bold 42px '+F;var cx=k?(X2+W)/2:(X1+X2)/2,lines=wrapText(x,m.name,(k?W-X2:X2-X1)-110);
      lines.forEach(function(t,j){x.fillText(t,cx,y+RH/2+(j-(lines.length-1)/2)*58)});
    });
  }
  return c;
}
function makePng(){
  var pl=planSlots(),box=$('plImgs');box.innerHTML='';
  var weeks=Math.ceil(pl.length/14);
  function go(){
    var fin=document.createElement('div');fin.style.cssText='margin-top:16px;display:grid;gap:8px';fin.innerHTML='<p style="margin:0;color:var(--muted);font-size:13.5px">Quand tu as fini tes courses, repars de zéro : la sélection, la liste cochée et le planning sont effacés (tes repas restent). Attention : la liste de courses disparaît aussi, garde-la pour le magasin.</p><button class="btn danger" data-act="pl-reset">Terminer et repartir de zéro</button>';
    for(var w=0;w<weeks;w++){
      (function(w){
        var cv=drawWeek(pl.slice(w*14,w*14+14)),url=cv.toDataURL('image/png');
        var wrap=document.createElement('div');wrap.style.marginTop='16px';
        wrap.innerHTML='<img src="'+url+'" alt="Planning semaine '+(w+1)+'" style="width:100%;border-radius:8px;background:#fff"><div class="btns" style="margin-top:8px"><a class="btn" download="planning-semaine-'+(w+1)+'.png" href="'+url+'">Télécharger semaine '+(w+1)+'</a><button class="btn" data-act="pl-share" data-w="'+w+'">Partager</button></div>';
        box.insertBefore(wrap,fin.parentNode===box?fin:null);wrap._cv=cv;wrap.querySelector('[data-act=pl-share]').onclick=function(){
          cv.toBlob(function(b){var f=new File([b],'planning-semaine-'+(w+1)+'.png',{type:'image/png'});
            if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(function(){});
            else toast('Appui long sur l’image pour l’enregistrer')});
        };
      })(w);
    }
    box.appendChild(fin);
  }
  (document.fonts&&document.fonts.load?document.fonts.load('bold 42px "Open Sans"').then(go,go):Promise.resolve(go())).then(function(){try{box.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}});
}

/* Appui long sur une ligne de la liste : voir à quels repas elle appartient */
(function(){
  var tm=null,sx=0,sy2=0,fired=false;
  function clr(){clearTimeout(tm);tm=null}
  document.addEventListener('pointerdown',function(ev){
    var b=ev.target.closest&&ev.target.closest('.ln .lt[data-key]');if(!b) return;
    fired=false;sx=ev.clientX;sy2=ev.clientY;clr();
    tm=setTimeout(function(){fired=true;try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}openLine(b.dataset.key)},500);
  });
  document.addEventListener('pointermove',function(ev){if(tm&&(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy2)>10)) clr()});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){document.addEventListener(n,clr)});
  document.addEventListener('click',function(ev){if(fired&&ev.target.closest&&ev.target.closest('.ln .lt')){ev.stopPropagation();ev.preventDefault();fired=false}},true);
  document.addEventListener('contextmenu',function(ev){var b=ev.target.closest&&ev.target.closest('.ln .lt[data-key]');if(b){ev.preventDefault();clr();fired=true;openLine(b.dataset.key)}});
})();
